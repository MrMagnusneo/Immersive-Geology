name: NeoForge 1.21.1 port

on:
  push:
    branches:
      - codex/neoforge-1.21.1-port
  pull_request:
    branches:
      - neoforge-1.21.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Checkout immutable Forge baseline
        uses: actions/checkout@v4
        with:
          ref: cfa6707983bbdac2bb5c2a740d2bff8942b1cb28
          path: forge-baseline

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify platform and content contracts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/content_manifest.py --compare-root forge-baseline --allow-content-changes --replacements src/test/resources/neoforge-1.21.1-content-replacements.json

      - name: Build gameplay JAR and compile game tests
        run: ./gradlew --no-daemon --stacktrace clean jar gametestClasses test

      - name: Verify packaged NeoForge gameplay JAR
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'ImmersiveGeology-*.jar' ! -name '*-sources.jar' ! -name '*-datagen.jar')
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one gameplay JAR, found ${#jars[@]}"
            exit 1
          fi
          unzip -l "${jars[0]}" | grep -F 'META-INF/neoforge.mods.toml'
          unzip -l "${jars[0]}" | grep -F 'com/igteam/immersivegeology/ImmersiveGeology.class'
          echo "GAMEPLAY_JAR=${jars[0]}" >> "$GITHUB_ENV"

      - name: Upload NeoForge gameplay JAR
        uses: actions/upload-artifact@v4
        with:
          name: immersive-geology-neoforge-1.21.1
          path: ${{ env.GAMEPLAY_JAR }}
          if-no-files-found: error

      - name: Compile complete data-generation source set
        run: ./gradlew --no-daemon --stacktrace datagenClasses
