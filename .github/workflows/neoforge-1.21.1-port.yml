name: NeoForge 1.21.1 port

on:
  push:
    branches:
      - codex/neoforge-1.21.1-port
  pull_request:
    branches:
      - neoforge-1.21.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Checkout immutable Forge baseline
        uses: actions/checkout@v4
        with:
          ref: cfa6707983bbdac2bb5c2a740d2bff8942b1cb28
          path: forge-baseline

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify platform and content contracts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/content_manifest.py --compare-root forge-baseline --allow-content-changes --replacements src/test/resources/neoforge-1.21.1-content-replacements.json

      - name: Compile NeoForge port
        run: ./gradlew --no-daemon --stacktrace compileJava
