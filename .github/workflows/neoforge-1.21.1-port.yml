name: NeoForge 1.21.1 port

on:
  push:
    branches:
      - codex/neoforge-1.21.1-port
      - neoforge-1.21.1
  pull_request:
    branches:
      - neoforge-1.21.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        verification: [1, 2, 3]
    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Checkout immutable Forge baseline
        uses: actions/checkout@v4
        with:
          ref: cfa6707983bbdac2bb5c2a740d2bff8942b1cb28
          path: forge-baseline

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify platform and content contracts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/content_manifest.py --compare-root forge-baseline --allow-content-changes --replacements src/test/resources/neoforge-1.21.1-content-replacements.json

      - name: Build gameplay JAR and compile game tests
        run: ./gradlew --no-daemon --console=plain --stacktrace clean build gametestClasses

      - name: Verify packaged NeoForge gameplay JAR
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'ImmersiveGeology-*.jar' ! -name '*-sources.jar' ! -name '*-datagen.jar')
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one gameplay JAR, found ${#jars[@]}"
            exit 1
          fi
          unzip -l "${jars[0]}" | grep -F 'META-INF/neoforge.mods.toml'
          unzip -l "${jars[0]}" | grep -F 'com/igteam/immersivegeology/ImmersiveGeology.class'
          echo "GAMEPLAY_JAR=${jars[0]}" >> "$GITHUB_ENV"
          sha256sum "${jars[0]}"

      - name: Upload NeoForge gameplay JAR
        uses: actions/upload-artifact@v4
        with:
          name: immersive-geology-neoforge-1.21.1-verification-${{ matrix.verification }}
          path: ${{ env.GAMEPLAY_JAR }}
          if-no-files-found: error

      - name: Compile complete data-generation source set
        run: ./gradlew --no-daemon --stacktrace datagenClasses

  runtime-validation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate all data resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-logs
          ./gradlew --no-daemon --console=plain --stacktrace runData 2>&1 | tee validation-logs/datagen.log
          python3 scripts/validate_runtime_log.py --kind datagen validation-logs/datagen.log

      - name: Upload generated-resource diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-resources-after-runData
          path: src/generated/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Start NeoForge server and run game tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run validation-logs
          touch run/server.properties
          ./gradlew --no-daemon --console=plain --stacktrace runGameTestServer 2>&1 | tee validation-logs/gametest.log
          python3 scripts/validate_runtime_log.py --kind gametest validation-logs/gametest.log

      - name: Upload runtime validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-runtime-validation-logs
          path: validation-logs
          if-no-files-found: warn

      - name: Reject generated resource drift
        run: |
          git status --short -- src/generated/resources
          git diff --exit-code --diff-filter=ACMRTUXB -- src/generated/resources
          test -z "$(git ls-files --others --exclude-standard -- src/generated/resources)"
          diff -u scripts/optional_tfc_generated_resources.txt <(git diff --name-only --diff-filter=D -- src/generated/resources | sort)

  reproducibility:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the three independently built gameplay JARs
        uses: actions/download-artifact@v4
        with:
          pattern: immersive-geology-neoforge-1.21.1-verification-*
          path: verified-jars

      - name: Require byte-identical gameplay JARs
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          jars = sorted(Path('verified-jars').rglob('*.jar'))
          if len(jars) != 3:
              raise SystemExit(f'Expected three gameplay JARs, found {len(jars)}')
          hashes = [hashlib.sha256(path.read_bytes()).hexdigest() for path in jars]
          for path, digest in zip(jars, hashes):
              print(digest, path)
          if len(set(hashes)) != 1:
              raise SystemExit('Independent gameplay JARs are not byte-identical')
          PY
