name: Pull Request
on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1000
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew --no-daemon --console=plain build

  notify-discord:
    runs-on: ubuntu-latest
    name: Notify Discord
    env:
      DISCORD_WEBHOOK: ${{ secrets.WH_PR_PUBLIC }}
    steps:
      - name: Notify Internal Discord
        if: env.DISCORD_WEBHOOK != ''
        uses: sebastianpopp/discord-action@releases/v2
        with:
          webhook: ${{ secrets.WH_PR_PUBLIC }}
          message: "[@${{ github.event.pull_request.user.login }}](<https://github.com/${{ github.event.pull_request.user.login }}>) has contributed to Engineers' Cause with [${{ github.event.pull_request.title }}](<https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}>)."
